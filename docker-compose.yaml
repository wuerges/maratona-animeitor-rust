# Published-image Jones demo. Generate the development certificate, then compose up.
name: animeitor
services:
  animeitor:
    image: wuerges/animeitor:latest
    entrypoint: /animeitor-server
    command: [--server-config, /workspace/server.toml]
    # Host-local access only. A public proxy must be the sole ingress.
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:8443:8443"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 256
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      RUST_LOG: info
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ./server.docker.toml.example:/workspace/server.toml:ro
      - ./config/dev-certs/localhost-cert.pem:/workspace/config/dev-certs/localhost-cert.pem:ro
      - ./config/dev-certs/localhost-key.pem:/workspace/config/dev-certs/localhost-key.pem:ro
      - ./server/photos:/photos:ro
      - ./server/sounds:/sounds:ro
      - ./animeitor-client/static/user-styles.css:/dist/user-styles.css:ro
  feeder:
    image: wuerges/animeitor:latest
    entrypoint: /animeitor-feeder
    command: [--server-config, /workspace/server.toml, --event-config, /workspace/config/jones/event.toml, --event-secrets, /workspace/event-secrets.toml]
    depends_on: [animeitor]
    environment:
      RUST_LOG: info
    volumes:
      - ./server.docker.toml.example:/workspace/server.toml:ro
      - ./event-secrets.toml.example:/workspace/event-secrets.toml:ro
      - ./config/jones/event.toml:/workspace/config/jones/event.toml:ro
      - ./tests/inputs/webcast_jones.zip:/workspace/tests/inputs/webcast_jones.zip:ro
      - ./config/dev-certs/localhost-cert.pem:/workspace/config/dev-certs/localhost-cert.pem:ro
  printurls:
    image: wuerges/animeitor:latest
    entrypoint: /printurls
    command: [--server-config, /workspace/server.toml, --event-config, /workspace/config/jones/event.toml]
    volumes:
      - ./server.docker.toml.example:/workspace/server.toml:ro
      - ./config/jones/event.toml:/workspace/config/jones/event.toml:ro
  prometheus:
    image: prom/prometheus:latest
    profiles: [monitoring]
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [animeitor]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/dev-certs/localhost-cert.pem:/etc/animeitor-ca.pem:ro
      - prometheus-data:/prometheus
volumes:
  prometheus-data:
