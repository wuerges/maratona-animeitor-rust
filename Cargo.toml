[workspace]
members = ["server/database-sqlite", "server/database-memory", "server/data", "server/cli", "server/service", "server/server-v2", "animeitor-client", "client-sdk", "client-model", "tools/offline-packager"]
resolver = "2"

[workspace.package]
version = "2.2.2"
edition = "2024"
authors = ["Emilio Wuerges <wuerges@gmail.com>"]

[workspace.dependencies]
autometrics = { version = "3.0.0", features = ["prometheus-exporter", "metrics"] }
base64 = "0.23.1"
brotli = "9.0.0"
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
flate2 = "1.1.10"
futures = "0.3.34"
html-escape = "0.2.15"
hmac = "0.13.0"
sha2 = "0.11.0"
mime_guess = "2.0.5"
nanoid = "0.5.0"
reqwest = { version = "0.13.5", features = ["json"] }
regex = "1.13.1"
itertools = "0.15.0"
metrics = "0.24.6"
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
parking_lot = "0.12.5"
rand = "0.10.3"
thiserror = "2.0.21"
toml = "1.1.6"
sentry = { version = "0.49.3", features = ["tracing"] }
sentry-tracing = "0.49.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
url = "2.5.8"
zip = "8.6.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
axum = { version = "0.8.9", features = ["ws", "http1", "http2", "json", "tokio"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "compression-gzip"] }
http-body-util = "0.1.5"
rstest = "0.27.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = "0.30.0"
utoipa = { version = "6.0.0", features = ["macros"] }

data = { path = "server/data" }
cli = { path = "server/cli" }
service = { path = "server/service" }
database-memory = { path = "server/database-memory" }
database-sqlite = { path = "server/database-sqlite" }
server-v2 = { path = "server/server-v2" }
client-sdk = { path = "client-sdk" }
client-model = { path = "client-model" }
log = "0.4.34"
console_log = "1.1.0"
console_error_panic_hook = "0.1.7"
reactive_graph = { version = "0.2.15", features = ["serde"] }
gloo-net = "0.7.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
wasm-bindgen-futures = "0.4.79"

# lto/panic cannot be set per-package; lto applies to the whole workspace
[profile.release]
lto = true

[profile.release.package.animeitor-client]
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package.client-sdk]
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package.client-model]
opt-level = "z"
codegen-units = 1
strip = true
