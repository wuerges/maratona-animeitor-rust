[workspace]
members = ["server/data", "server/cli", "server/service", "server/server-v2", "client-v2", "client-sdk", "client-model"]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2024"
authors = ["Emilio Wuerges <wuerges@gmail.com>"]

[workspace.dependencies]
autometrics = { version = "3", features = ["prometheus-exporter", "metrics"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
futures = "0.3"
html-escape = "0.2"
hmac = "0.12"
sha2 = "0.10"
reqwest = { version = "0.13", features = ["native-tls-vendored", "json"] }
regex = "1.11"
itertools = "0.14"
metrics = "0.24"
openssl = { version = "0.10", features = ["vendored"] }
rustls = "0.23"
rustls-pemfile = "2"
parking_lot = "0.12"
rand = "0.10"
thiserror = "2"
toml = "1.1"
sentry = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47", features = ["full"] }
url = "2"
zip = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws", "http1", "http2", "json", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
http-body-util = "0.1"
rstest = "0.26"
tokio-stream = { version = "0.1", features = ["sync"] }

data = { path = "server/data" }
cli = { path = "server/cli" }
service = { path = "server/service" }
server-v2 = { path = "server/server-v2" }
client-sdk = { path = "client-sdk" }
client-model = { path = "client-model" }
log = "0.4"
console_log = "1"
reactive_graph = { version = "0.2", features = ["serde"] }
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-futures = "0.4"

# lto/panic cannot be set per-package; lto applies to the whole workspace
[profile.release]
lto = true

[profile.release.package.client-v2]
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package.client-sdk]
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package.client-model]
opt-level = "z"
codegen-units = 1
strip = true
