# Prometheus preconfigurado para monitorar o animeitor de
# animeitor.naquadah.com.br. O servidor expõe as métricas (autometrics)
# em /api/metrics na porta HTTP (80).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: animeitor
    metrics_path: /api/metrics
    scheme: http
    static_configs:
      - targets: ["animeitor.naquadah.com.br:80"]
