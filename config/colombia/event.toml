# Example Colombian event. Public derivation values are safe to commit;
# revelation keys also require the private server salt.
[event]
name = "colombia"
secret = "development-event-value"

# Match any login containing "team".
[[contests]]
name = "Teams"
codes = ["team"]

[[contests.sites]]
name = "General"
codes = ["team"]

# A separate scoreboard for any login containing "ccl".
[[contests]]
name = "CCLs"
codes = ["ccl"]

[[contests.sites]]
name = "General"
codes = ["ccl"]
