# Legacy filename. Requires http-protection.conf in the enclosing http {} block.
# Replace public certificate paths and verify the upstream certificate's CA/name.
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name animeitor.example.com;
    ssl_certificate /etc/letsencrypt/live/animeitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animeitor.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AnimeitorTLS:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/animeitor-access.log animeitor_safe;
    error_log /var/log/nginx/animeitor-error.log crit;
    limit_req zone=animeitor_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn animeitor_per_ip 64;
    limit_conn animeitor_total 2048;
    limit_conn_status 429;

    location / {
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        # Trust this header only when nginx is the sole ingress.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $animeitor_connection;
        proxy_set_header Host $host;
        # The internal API requires the server's actual TLS listener.
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/animeitor-upstream-ca.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 90s;
        proxy_redirect off;
    }
}
