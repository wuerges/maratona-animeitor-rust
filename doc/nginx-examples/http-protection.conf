# Include ONCE inside nginx's http {} block, before either server example.
# These are starting budgets; size them for the contest and shared-IP viewers.
limit_req_zone $binary_remote_addr zone=animeitor_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=animeitor_per_ip:10m;
limit_conn_zone $server_name zone=animeitor_total:1m;

map $http_upgrade $animeitor_connection {
    default upgrade;
    '' close;
}

# Never log query strings (the client can carry remote_control there) or keys
# embedded in either the public WebSocket or internal revocation path.
map $uri $animeitor_log_path {
    ~^/(api|internal)/events/[^/]+/contests/[^/]+/remote_control/ /remote-control/<redacted>;
    default $uri;
}
log_format animeitor_safe '$remote_addr "$request_method $animeitor_log_path $server_protocol" '
                         '$status $body_bytes_sent $request_time';

client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 10s;
keepalive_timeout 15s;
keepalive_requests 100;
client_max_body_size 2m;
