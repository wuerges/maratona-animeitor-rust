server {
    listen       80;
    server_name  localhost;

    # The animeitor server registers its routes under the /api scope; the
    # prefix is preserved (no trailing slash in proxy_pass).
    location /api/ {
        resolver 127.0.0.11;
        proxy_pass http://animeitor:8000;

        # websocket connection upgrade
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        # websocket timeouts:
        proxy_read_timeout 1200s;

    }

    # The client build is an SPA served at /animeitor/{event}/{contest};
    # unknown paths fall back to its index.html.
    location /animeitor/ {
        root   /usr/share/nginx/html;
        try_files $uri /animeitor/index.html;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
