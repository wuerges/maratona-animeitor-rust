# Requires http-protection.conf in the enclosing http {} block.
# Private-network HTTP example. Terminate public TLS at a trusted edge, or add
# certificates here. Only /api is forwarded; internal administration uses HTTPS.
server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/animeitor-access.log animeitor_safe;
    # nginx error logs may contain raw request URIs; omit request-level errors
    # so capability paths and query strings cannot escape the safe access log.
    error_log /var/log/nginx/animeitor-error.log crit;
    limit_req zone=animeitor_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn animeitor_per_ip 64;
    limit_conn animeitor_total 2048;
    limit_conn_status 429;

    location /api/ {
        resolver 127.0.0.11;
        # Resolve the Compose service at request time, preserving the full URI.
        set $animeitor_upstream animeitor:8000;
        proxy_pass http://$animeitor_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $animeitor_connection;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 90s;
    }

    location /animeitor/ {
        root /usr/share/nginx/html;
        try_files $uri /animeitor/index.html;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
